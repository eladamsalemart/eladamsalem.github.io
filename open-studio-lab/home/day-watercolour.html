<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daylight, in watercolour · Open Studio Home</title>
<meta name="theme-color" content="#FBF4F2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Figtree:wght@700&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Hebrew:wght@600&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="day.css">
<style>
/* Variation 2 · Watercolour: more paint. The sky isn't a gradient but a sheet of paper painted in wet pastel blooms
   that bleed into each other; every star sits in a pool of its colour; the ties are a fine ink pen, the notes in
   ink. The page below carries the same washes behind its headings and people. */
:root{--hand:'Caveat',cursive;--hand-size:22px;--hand-weight:500;--hand-ink:#33408F;--tie:#33408F;--tie-maybe:#7983C2;--pencil:#33408F;--ground:#FBF7F6;
  --artist:#F4A6BC;--show:#98D3B6;--tour:#BDB0F2;--place:#F8D27A;--work:#F6B596}
.hero{background:#FCF8F6}
.paint{position:absolute;inset:-60px;z-index:0;filter:url(#bloom);opacity:.9;pointer-events:none}
.paint i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--b),color-mix(in srgb,var(--b) 40%,transparent) 65%,transparent)}
.skybox{z-index:1}
.sky-ties{filter:none}
.star .wash{width:calc(var(--d) * 3);height:calc(var(--d) * 2.6);opacity:.95}
.star .ring{display:none}
.star .st{box-shadow:0 0 0 3px #fff,0 14px 28px -14px var(--shade)}
.star .lab .hand{font-size:20px;line-height:1}
.hello .hand{font-size:23px}
.hint{font-size:19px}
.sec-h{position:relative;isolation:isolate}
.sec-h h2::after{display:none}
.sec-h::before{content:"";position:absolute;z-index:-1;left:-14px;top:-4px;width:min(290px,80%);height:46px;border-radius:50%;background:radial-gradient(closest-side,var(--sw,var(--artist)),transparent);filter:url(#wc);opacity:.85}
.live .sec-h{--sw:var(--tour)}.artists .sec-h{--sw:var(--artist)}.theirs .sec-h{--sw:var(--show)}.near .sec-h{--sw:var(--place)}
.ppl li::before{width:110px;height:100px;left:-22px;top:-8px}
.tour-wrap::before{content:"";position:absolute;inset:-26px -20px -18px;border-radius:50% 50% 40% 40%;background:radial-gradient(closest-side,color-mix(in srgb,var(--tour) 80%,transparent),transparent);filter:url(#wc);z-index:-1}
.tour-wrap{isolation:isolate}
.sketch-arch{display:none}
.shows img{box-shadow:none}
.shows li{position:relative;isolation:isolate}
.shows li::before{content:"";position:absolute;z-index:-1;inset:-14px -10px auto;height:80%;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);filter:url(#wc);opacity:.8}
.shows li:nth-child(1){--c:var(--show)}.shows li:nth-child(2){--c:var(--artist)}.shows li:nth-child(3){--c:var(--tour)}
.shows .when{font-size:23px}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { day } from './day.js';
// a second, wetter filter for the blooms of the sky
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="bloom" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="70"/><feGaussianBlur stdDeviation="2"/></filter></svg>`);
const BLOOMS = [[-6, 2, 70, 34, '#F9C7B4'], [52, -2, 62, 30, '#C9DDF5'], [8, 34, 58, 30, '#F5B8CB'], [56, 40, 56, 32, '#D2C6F4'], [-4, 66, 64, 30, '#BFE5D0'], [48, 72, 60, 30, '#F8DE95'], [20, 88, 70, 24, '#F5C3D1']];
day({
  copy: { title: 'Your sky, today', hand: 'painted from where you were last' },
  sketchArch: true,
  after(app) {
    const paint = document.createElement('div'); paint.className = 'paint'; paint.setAttribute('aria-hidden', 'true');
    paint.innerHTML = BLOOMS.map(([x, y, w, h, c]) => `<i style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;--b:${c}"></i>`).join('');
    app.querySelector('.hero').prepend(paint);
  },
});
</script>
</body>
</html>
