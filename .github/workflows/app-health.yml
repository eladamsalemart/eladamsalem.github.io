# Open Studio: the app's health, on the live site, as a phone sees it (studio/app/health/). After every publish of the
# app (each real change) and every three days. The report lives in one standing issue (label "health-report"), edited
# in place; it carries the label "app-health" only while something is broken. A scheduled Claude session reads it,
# fixes what is broken, proves the fix, and takes one improvement at a time (studio/app/health/PLAYBOOK.md).
# No mail to the owner's own address (the owner's word, 11.11): the run itself never ends red (GitHub mails every failed
# run to whoever started it), the job inside it does; nothing is commented, closed or reopened; and a change of state
# (broken, well again) is mailed to the app's mailbox, ooopenstudio@gmail.com.
name: "App health"

on:
  workflow_run:
    workflows: ["Open Studio app"]
    types: [completed]
  schedule:
    - cron: "23 1 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: app-health
  cancel-in-progress: false

jobs:
  health:
    continue-on-error: true          # a broken app fails this job, not the run: a failed run mails the owner
    runs-on: ubuntu-24.04            # the OS playwright 1.56.1 (the version checked locally) installs on; 26.04 it cannot
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: A browser to look with
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for the published version to reach the site (its pages are cached for minutes)
        if: github.event_name == 'workflow_run'
        run: sleep 300
      - name: Look at the app
        id: look
        env:
          NODE_PATH: /tmp/pw/node_modules
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/health"
          node studio/app/health/health.cjs https://eladamsalem.com/open-studio/ "$RUNNER_TEMP/health"; pages=$?
          node studio/app/check_home.cjs https://eladamsalem.com/open-studio/ "$RUNNER_TEMP/health" > "$RUNNER_TEMP/health/home.txt"; home=$?
          python3 studio/app/check_app.py > "$RUNNER_TEMP/health/app.txt"; app=$?
          python3 studio/app/health/deps.py "$RUNNER_TEMP/health/deps.json" > "$RUNNER_TEMP/health/deps.txt"; deps=$?
          cat "$RUNNER_TEMP/health/home.txt" "$RUNNER_TEMP/health/app.txt" "$RUNNER_TEMP/health/deps.txt"
          {
            cat "$RUNNER_TEMP/health/report.md"
            echo; echo "## Home's own check"; echo '```'; cat "$RUNNER_TEMP/health/home.txt"; echo '```'
            echo "## The app's check"; echo '```'; grep -v '^ok' "$RUNNER_TEMP/health/app.txt" || echo "all ok"; echo '```'
            echo "## Libraries"; echo '```'; cat "$RUNNER_TEMP/health/deps.txt"; echo '```'
            echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (screenshots in its artifact)"
          } > "$RUNNER_TEMP/health/issue.md"
          if [ $pages -ne 0 ] || [ $home -ne 0 ] || [ $app -ne 0 ] || [ $deps -ne 0 ]; then echo "broken=1" >> "$GITHUB_OUTPUT"; else echo "broken=0" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the screenshots and reports for two weeks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-health
          path: ${{ runner.temp }}/health
          retention-days: 14
      - name: Keep the report in one issue, edited in place (labelled app-health only while something is broken)
        id: issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No comments, no closing and reopening: each of those mails the repository's owner at their own address.
          # An edit of the body, the title or the labels mails no one.
          mkdir -p "$RUNNER_TEMP/health"
          gh label create app-health --color D93F0B --description "Found by the App health check" 2>/dev/null || true
          gh label create health-report --color 0E8A16 --description "App health's standing report, edited in place" 2>/dev/null || true
          was=$(gh issue list --label app-health --state open --json number -q '.[0].number')
          n=$(gh issue list --label health-report --state open --json number -q '.[0].number')
          [ -n "$n" ] || n="$was"
          broken="${{ steps.look.outputs.broken }}"
          # the checks could not run at all (the browser didn't install, the site didn't answer): that is no all-clear
          if [ -z "$broken" ]; then broken=1; printf '# App health could not run its checks\n\nSee the run: %s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/health/issue.md"; fi
          { echo "Checked $(date -u '+%Y-%m-%d %H:%M') UTC."; echo; head -c 60000 "$RUNNER_TEMP/health/issue.md"; } > "$RUNNER_TEMP/health/body.md"
          if [ "$broken" = "1" ]; then
            [ -n "$was" ] || echo "changed=broken" >> "$GITHUB_OUTPUT"
            if [ -n "$n" ]; then gh issue edit "$n" --title "App health: something is broken" --body-file "$RUNNER_TEMP/health/body.md" --add-label app-health --add-label health-report
            else gh issue create --title "App health: something is broken" --label app-health --label health-report --body-file "$RUNNER_TEMP/health/body.md"; fi
            echo "::error::App health: something is broken (the report is in the issue labelled app-health)"
            exit 1
          elif [ -n "$n" ]; then
            [ -z "$was" ] || echo "changed=well" >> "$GITHUB_OUTPUT"
            gh issue edit "$n" --title "App health: all is well" --body-file "$RUNNER_TEMP/health/body.md" --remove-label app-health --add-label health-report
          fi
      - name: Tell the app's mailbox when the state changes (the owner's own address gets nothing)
        if: always() && steps.issue.outputs.changed != ''
        env:
          MAIL_USER: ooopenstudio@gmail.com
          MAIL_PASSWORD: ${{ secrets.ART_MAIL_PASSWORD }}
          CHANGED: ${{ steps.issue.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - "$RUNNER_TEMP/health/body.md" <<'EOF' || echo "::warning::the mail to the app's mailbox did not go out"
          import os, smtplib, sys
          from email.message import EmailMessage
          m = EmailMessage()
          m['From'] = m['To'] = os.environ['MAIL_USER']
          m['Subject'] = 'Open Studio, App health: ' + ('something is broken' if os.environ['CHANGED'] == 'broken' else 'all is well again')
          m.set_content(os.environ['RUN_URL'] + '\n\n' + open(sys.argv[1], encoding='utf-8', errors='replace').read()[:6000])
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=60) as s:
              s.login(os.environ['MAIL_USER'], os.environ['MAIL_PASSWORD'])
              s.send_message(m)
          EOF
