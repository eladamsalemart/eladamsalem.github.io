# Open Studio art map: what's on today at Israel's art places (exhibitions with their dates, openings, gallery
# talks), read from each place's own website (studio/app/artmap/sources.tsv). Daily, and by hand.
# Writes studio/app/data/art/exhibitions.json and exhibitions.health.json on the studio branch.
name: "Art map: exhibitions"

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read          # GitHub Models, free: a language model reads each place's page

concurrency:
  group: art-map-data
  cancel-in-progress: false

jobs:
  exhibitions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: A browser, for the sites that build their pages in it
        run: |
          pip install playwright==1.64.1 anthropic==2.3.0
          python3 -m playwright install --with-deps chromium
      - name: Read what's on
        # a language model also reads each page, free through GitHub Models (Claude instead if the key is set); each page once until it changes
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 studio/app/artmap/exhibitions.py
      - name: Commit to studio
        run: |
          git config user.name "open-studio"
          git config user.email "open-studio@users.noreply.github.com"
          git add studio/app/data/art/exhibitions.json studio/app/data/art/exhibitions.health.json
          git add studio/app/artmap/cache 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Art map: what's on, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin studio && git push origin HEAD:studio && exit 0
            sleep 5
          done
          exit 1
