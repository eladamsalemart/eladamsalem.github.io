# Open Studio art map: what's on today at Israel's art places (exhibitions with their dates, openings, gallery
# talks), read from each place's own website (studio/app/artmap/sources.tsv). Daily, and by hand.
# Writes studio/app/data/art/exhibitions.json and exhibitions.health.json on the studio branch.
name: "Art map: exhibitions"

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-map-data
  cancel-in-progress: false

jobs:
  exhibitions:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: A browser, for the sites that build their pages in it
        run: |
          pip install playwright==1.64.1 anthropic==2.3.0
          python3 -m playwright install --with-deps chromium
      - name: An open model on this machine (free), for the pages the rules can't read
        # Ollama's own image, pinned to a version and its digest; the model is Qwen 2.5 7B
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
          until curl -s http://127.0.0.1:11434/api/version; do sleep 1; done
          docker exec ollama ollama pull qwen2.5:7b
      - name: Read what's on
        # an open model reads the pages the rules can't (free, on this machine; Claude instead if the key is set); each page once until it changes
        env:
          OLLAMA_MODEL: qwen2.5:7b
          FREE_MINUTES: '180'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 studio/app/artmap/exhibitions.py
      - name: Commit to studio
        run: |
          git config user.name "open-studio"
          git config user.email "open-studio@users.noreply.github.com"
          git add studio/app/data/art/exhibitions.json studio/app/data/art/exhibitions.health.json
          git add studio/app/artmap/cache 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Art map: what's on, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin studio && git push origin HEAD:studio && exit 0
            sleep 5
          done
          exit 1
