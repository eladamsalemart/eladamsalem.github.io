# Open Studio art map: Israel's art places (museums, galleries, art centres), with the building each is in.
# Monthly, and by hand. Writes studio/app/data/art/places.json and places.changes.md on the studio branch;
# the app is published from there by the "Open Studio app" workflow.
name: "Art map: places"

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-map-data
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install osmium==4.3.2
      - name: Build the art places
        run: python3 studio/app/artmap/places.py
      - name: Commit to studio
        run: |
          git config user.name "open-studio"
          git config user.email "open-studio@users.noreply.github.com"
          git add studio/app/data/art/places.json studio/app/data/art/places.changes.md
          git diff --cached --quiet && exit 0
          git commit -m "Art map: places, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin studio && git push origin HEAD:studio && exit 0
            sleep 5
          done
          exit 1
