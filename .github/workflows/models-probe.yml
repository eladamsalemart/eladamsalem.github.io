# One request to GitHub Models with the workflow's token: what comes back (status, headers, body). By hand only.
name: "Probe: GitHub Models"
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask once
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi"}]}'
          for url in https://models.github.ai/inference/chat/completions https://models.github.ai/orgs/eladamsalemart/inference/chat/completions https://models.inference.ai.azure.com/chat/completions https://models.github.ai/catalog/models; do
            echo "== $url"
            if [[ $url == *catalog* ]]; then curl -sS -D - "$url" -H "Authorization: Bearer $TOKEN" | head -c 800; else
            curl -sS -D - -X POST "$url" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" -H "X-GitHub-Api-Version: 2022-11-28" -d "$body" | head -c 800; fi
            echo
          done
