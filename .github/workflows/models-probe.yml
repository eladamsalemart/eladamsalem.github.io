# A trial of the free reader: an open model run by Ollama on this machine reads a few places' pages. By hand only.
name: "Probe: free model"
on:
  workflow_dispatch:
    inputs:
      models:
        description: Ollama models to try, space-separated
        default: qwen2.5:3b qwen2.5:7b
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for m in ${{ inputs.models }}; do ollama pull $m; done
      - name: Read a few places with each model
        run: |
          for m in ${{ inputs.models }}; do
            echo "=================== $m"
            start=$(date +%s)
            OLLAMA_MODEL=$m python3 studio/app/artmap/exhibitions.py --only petach-tikva,haifa-museum,tikotin,negev-museum,artists-house-tlv --dry --no-browser
            echo "took $(( $(date +%s) - start )) s"
          done
