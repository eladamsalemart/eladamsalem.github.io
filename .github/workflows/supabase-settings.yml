# Open Studio: Supabase's sign-in settings, through its management API (studio/supabase/settings.py). By hand:
# 'show' writes what is set now to studio/supabase/auth.live.json (no passwords or keys); 'apply' sets what
# studio/supabase/auth.json says (and switches on Google/Apple sign-in when their secrets exist), then shows.
# Monthly it applies again, so Apple's six-month client secret is always fresh.
name: "Supabase settings"

on:
  workflow_dispatch:
    inputs:
      do:
        description: "show, or apply auth.json"
        type: choice
        options: [show, apply]
        default: show
  schedule:
    - cron: "17 3 2 * *"

permissions:
  contents: write

concurrency:
  group: supabase-settings
  cancel-in-progress: false

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
      - run: pip install --quiet "pyjwt[crypto]"
      - name: Supabase's sign-in settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_P8: ${{ secrets.APPLE_P8 }}
        run: python3 studio/supabase/settings.py ${{ inputs.do || 'apply' }}
      - name: Keep what is set now with the code
        run: |
          git config user.name "open-studio"
          git config user.email "open-studio@users.noreply.github.com"
          git add studio/supabase/auth.live.json
          git diff --cached --quiet && exit 0
          git commit -m "Supabase: the sign-in settings as they are, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin studio && git push origin HEAD:studio && exit 0
            sleep 5
          done
          exit 1
