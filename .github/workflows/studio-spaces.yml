# Studio: rebuild every exhibition's 3D space from its photos and works, whenever they change.
# Content is edited on main (the site editor); Studio lives on the studio branch. A change on either
# brings main's content into studio, runs studio/app/space/pipeline there in two stages (build the space
# from the photos and the works; then inspect it in the app's own viewer, in a browser), and commits the
# spaces to studio. Only a space that passes both stages is listed for the app (data/spaces/index.json).
name: Studio spaces

on:
  push:
    branches: [main, studio]
    paths:
      - 'content/works.json'
      - 'content/exhibitions.json'
      - 'media/works/**'
      - 'studio/app/data/studio.json'
      - 'studio/app/data/spaces/*.overrides.json'
      - 'studio/app/space/pipeline/**'
      - 'studio/app/space/inspect/**'
      - 'studio/app/space/space.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-spaces
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
          fetch-depth: 0
      - name: Bring in main's content
        run: |
          git config user.name "studio-spaces"
          git config user.email "studio-spaces@users.noreply.github.com"
          git fetch origin main
          # main is where content is edited, so on any clash its version wins; the merge is committed by hand
          # so that, in one commit: media and content are exactly main's (studio never keeps its own copies),
          # and the workflows stay as they are on studio (this job may not change workflow files)
          git merge --no-commit --no-ff -X theirs origin/main || true
          git checkout origin/main -- media content
          git checkout HEAD -- .github
          if [ -f .git/MERGE_HEAD ] || ! git diff --cached --quiet; then
            git commit --no-edit -m "Studio: bring in the site's latest content"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep the inpainting model between runs
        uses: actions/cache@v4
        with:
          path: studio/app/space/.cache/inpainting_lama_2025jan.onnx
          key: lama-2025jan
      - name: Install
        run: pip install opencv-python-headless==5.0.0.93 numpy scipy pillow
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install a browser for the inspection
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Build and inspect the spaces
        run: python -m studio.app.space.pipeline
      - name: Commit and push to studio
        run: |
          git add studio/app/data/spaces
          git diff --cached --quiet || git commit -m "Studio: rebuild 3D spaces from the photos"
          # someone may have pushed to studio meanwhile: merge their work in (never rebase: that would replay
          # main's commits one by one, workflow files and all, which this job may not push), keeping our spaces
          for i in 1 2 3; do
            git pull --no-rebase --no-edit -X ours origin studio && git push origin HEAD:studio && exit 0
            sleep 5
          done
          exit 1
