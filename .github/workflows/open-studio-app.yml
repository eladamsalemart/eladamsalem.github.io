# Open Studio: publish the app from the studio branch to eladamsalem.com/open-studio/, where it installs
# on any phone (Add to Home Screen). Only that folder on main is written; the rest of the site is not touched.
# Runs when the app changes on studio, after the spaces are rebuilt, and after the art map's daily and monthly reads
# (their commits, made with the workflow's own token, start no workflow by themselves).
name: Open Studio app

on:
  push:
    branches: [studio]
    paths:
      - 'studio/app/**'
      - 'studio/desk/**'
      - '!studio/app/space/pipeline/**'
  workflow_run:
    workflows: [Studio spaces, Studio rooms, "Art map: exhibitions", "Art map: places"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-studio-app
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04            # the OS playwright 1.56.1 (the version checked locally) installs on; 26.04 it cannot
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pillow==12.3.0
      - name: Copy the app from studio
        run: |
          git fetch origin studio
          git worktree add /tmp/studio origin/studio
          src=/tmp/studio/studio/app
          rm -rf open-studio && mkdir -p open-studio/space open-studio/data/spaces
          cp $src/index.html $src/privacy.html $src/data-deletion.html $src/app.js $src/sky.js $src/artist.js $src/studio-cloud.js $src/studio-page.js $src/admin.js $src/artmap.js $src/auth.js $src/sw.js $src/manifest.webmanifest open-studio/
          cp -r $src/vendor open-studio/
          cp -r $src/icons open-studio/
          cp -r $src/data/demo open-studio/data/
          cp $src/data/spaces/*.status.json open-studio/data/spaces/ 2>/dev/null || true
          cp $src/space/space.js $src/space/synth.js $src/space/plinths.js $src/space/hang-editor.js open-studio/space/
          cp $src/data/studio.json $src/data/virtual.json open-studio/data/
          cp -r $src/data/art open-studio/data/ 2>/dev/null || true
          cp $src/data/spaces/index.json open-studio/data/spaces/
          # only the spaces that passed their checks (the ones index.json lists)
          for k in $(python3 -c "import json;print(' '.join(json.load(open('$src/data/spaces/index.json'))))"); do
            cp $src/data/spaces/$k.json open-studio/data/spaces/
            cp -r $src/data/spaces/$k open-studio/data/spaces/
          done
          # the virtual rooms' films and covers (the rooms themselves are drawn in the browser: space/synth.js)
          for k in $(python3 -c "import json;print(' '.join(s['slug'] for s in json.load(open('$src/data/virtual.json'))['shows']))"); do
            [ -d $src/data/spaces/$k ] && cp -r $src/data/spaces/$k open-studio/data/spaces/
          done
          # the ten kinds of room, their surfaces photographed in Blender ("Studio rooms"), for artists' own shows
          cp -r $src/data/rooms open-studio/data/ 2>/dev/null || true
          # small versions of the site's images, for grids and lists on a phone
          python3 /tmp/studio/studio/app/thumbs.py media open-studio
          # a share page for each show and each artist: a link that arrives with its picture and its name (WhatsApp, iMessage)
          python3 /tmp/studio/studio/app/share_pages.py /tmp/studio/studio/app open-studio
          # Open Studio Desk: the owner's control room for a computer and an iPad, at /open-studio-desk/ (it borrows the rooms and
          # the 3D viewer from /open-studio/, so nothing but its own four files is copied)
          rm -rf open-studio-desk && mkdir -p open-studio-desk
          cp /tmp/studio/studio/desk/index.html /tmp/studio/studio/desk/*.css /tmp/studio/studio/desk/*.js /tmp/studio/studio/desk/manifest.webmanifest open-studio-desk/
          cp -r /tmp/studio/studio/desk/icons open-studio-desk/
          # a new cache name with every version, so an installed app drops what it kept from the last one
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'open-studio-$(git -C /tmp/studio rev-parse --short HEAD)'/" open-studio/sw.js
      - name: Every file the app loads is published (a script left out of the copy above fails here, not on a phone)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          out = Path('open-studio'); missing = []
          for f in ('app.js', 'artmap.js', 'auth.js', 'artist.js', 'studio-cloud.js', 'studio-page.js', 'admin.js', 'index.html', 'sw.js'):
              if not (out / f).exists():
                  continue                                  # (one that's missing is named by what loads it)
              src = (out / f).read_text(encoding='utf-8')
              for ref in re.findall(r"import\(\s*'\./([^']+)'\s*\)|src\s*=\s*['\"]((?:vendor|space|icons)/[^'\"]+)['\"]|s\.src = '([^']+)'", src):
                  ref = next(r for r in ref if r)
                  if not (out / ref).exists():
                      missing.append(f'{f} loads {ref}')
          for ref in re.findall(r"'([\w./-]+\.js)'", (out / 'sw.js').read_text()):
              if not (out / ref).exists():
                  missing.append(f'sw.js keeps {ref}')
          print('\n'.join(missing) or 'every file the app loads is here')
          sys.exit(1 if missing else 0)
          PY
      - name: Check what phones will fetch (the map's tiles really are a map) and the art map's data
        run: python3 /tmp/studio/studio/app/check_app.py /tmp/studio/studio/app
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Home opens on a phone (the sky and its stars, the room, near you; no script error), from the copy going out
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1
          NODE_PATH=/tmp/pw/node_modules node /tmp/studio/studio/app/check_home.cjs http://localhost:8000/open-studio/
      - name: Commit and push to main
        run: |
          git config user.name "open-studio"
          git config user.email "open-studio@users.noreply.github.com"
          git add -A open-studio open-studio-desk
          git diff --cached --quiet && exit 0
          git commit -m "Open Studio: publish the app from studio"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
