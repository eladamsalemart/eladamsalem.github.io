# Open Studio art map: sign the app's mailbox (ooopenstudio@gmail.com) up to the art places' newsletters, so the daily
# read (art-exhibitions.yml) hears of openings and new shows by mail. By hand only: first a look, then the signup.
# What happened at each place: studio/app/artmap/newsletters.json on the studio branch.
name: "Art map: newsletters"

on:
  workflow_dispatch:
    inputs:
      sign_up:
        description: "Sign up (off: only look, and print what each place has)"
        type: boolean
        default: false
      only:
        description: "These places only, tried again whatever happened before (comma-separated ids; empty for all)"
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: art-map-data
  cancel-in-progress: false

jobs:
  newsletters:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: A browser
        run: |
          pip install playwright==1.64.1
          python3 -m playwright install --with-deps chromium
      - name: The places' newsletters
        env:
          ONLY: ${{ inputs.only }}
        run: python3 studio/app/artmap/newsletters.py ${{ inputs.sign_up && '--sign-up' || '' }} ${ONLY:+--only "$ONLY" --again}
      - name: Commit to studio
        if: ${{ inputs.sign_up }}
        run: |
          git config user.name "open-studio"
          git config user.email "open-studio@users.noreply.github.com"
          git add studio/app/artmap/newsletters.json
          git diff --cached --quiet && exit 0
          git commit -m "Art map: newsletters signed up to, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin studio && git push origin HEAD:studio && exit 0
            sleep 5
          done
          exit 1
