<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- app:head -->
<title>Studio · Elad Amsalem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
/* Layout: one artist's home, read top to bottom like a gallery wall. Phone-first: on larger screens the app keeps a phone-width column (iPad and desktop layouts come later) */
:root{
  --wall:#F3F2EE; --paper:#FBFBF9; --ink:#141516; --muted:#676B6F; --line:#E0DFDA; --card:#ECEBE6; --dot:#D0261D;
  --stage:#E9E8E3; --shade:rgba(10,10,11,.72);
  --serif:"Instrument Serif","Times New Roman",serif;
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#121314; --paper:#1A1B1D; --ink:#ECECE8; --muted:#9A9DA1; --line:#2C2E31; --card:#202124; --dot:#FF4A3D; --stage:#1C1D1F; color-scheme:dark}}
:root[data-theme="dark"]{--wall:#121314; --paper:#1A1B1D; --ink:#ECECE8; --muted:#9A9DA1; --line:#2C2E31; --card:#202124; --dot:#FF4A3D; --stage:#1C1D1F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media (min-width:600px){html{background:var(--card)}body{max-width:430px;margin-inline:auto;min-height:100vh;box-shadow:0 0 0 1px var(--line)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dot);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin-inline:auto}
.wrap.gut{box-sizing:content-box}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--wall) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px}
.brand{font-family:var(--serif);font-size:28px;text-decoration:none;line-height:1}
.back{font-size:14px;text-decoration:none;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:44px}
.back:hover{color:var(--ink)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* shared */
main{padding-bottom:max(64px,env(safe-area-inset-bottom,0px))}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--dot);vertical-align:.04em}
.sec{display:grid;gap:18px;padding-block:36px;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font-family:var(--serif);font-size:34px;line-height:1}
.more{font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap}
.more:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:10px 18px;min-height:44px;font-size:14px;font-weight:600;border:1.5px solid var(--ink);background:transparent;text-decoration:none;cursor:pointer}
.btn.f{background:var(--ink);color:var(--wall)}
.btn.g{border-color:var(--line);font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ph{background:var(--card)}

/* profile */
.hero{position:relative;background:var(--card)}
.hero img{width:100%;height:min(62vh,560px);object-fit:cover}
.hero .ov{position:absolute;inset:auto 0 0 0;padding-block:28px 22px;background:linear-gradient(to top,var(--shade),transparent);color:#fff}
.hero h1{font-family:var(--serif);font-size:56px;line-height:.92}
.hero .k{color:#DADAD6;margin-bottom:10px}
.statement{font-family:var(--serif);font-size:26px;line-height:1.2;max-width:30ch;padding-block:32px 8px}
.onview{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none}
.onview img{width:120px;height:120px;object-fit:cover;border-radius:10px}
.onview h3{font-family:var(--serif);font-size:30px;line-height:1}
.onview .m{color:var(--muted);font-size:14px;margin-top:6px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.rail>a{scroll-snap-align:start;text-decoration:none;display:grid;gap:8px;min-width:0}
.rail img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.rail b{font-weight:600}
.rail .m{font-size:13px;color:var(--muted)}
.list{display:grid;gap:2px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:10px;text-decoration:none;border-bottom:1px solid var(--line)}
.row img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.row .t{min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--muted)}
.row:hover b{text-decoration:underline}

/* archive */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:8px 14px;border-radius:99px;background:var(--card);text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.chip[aria-current="page"]{background:var(--ink);color:var(--wall)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 16px}
.grid a{text-decoration:none;display:grid;gap:8px;min-width:0}
.grid .im{background:var(--stage);aspect-ratio:1;padding:14px;border-radius:4px;max-width:100%}
.grid .im img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.16))}
.grid .c{font-size:13px;line-height:1.35}
.grid .c .m{color:var(--muted)}

/* work */
.stage{background:var(--stage);display:grid;place-items:center;padding:clamp(24px,6vw,64px) 16px;min-height:50vh}
.stage button{border:0;padding:0;background:none;cursor:zoom-in}
.stage img{max-height:70vh;width:auto;box-shadow:0 14px 30px rgba(0,0,0,.18)}
.work{display:grid;gap:24px;padding-block:24px}
.label{background:var(--paper);border:1px solid var(--line);padding:18px 20px;font-size:15px;line-height:1.5;max-width:420px;display:grid;gap:2px}
.label b{font-size:20px;font-weight:600}
.label .s{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:6px}
.scale{background:var(--paper);border:1px solid var(--line);padding:12px}
.scale svg{display:block;width:100%;height:auto}
.pn{display:flex;justify-content:space-between;gap:12px;padding-block:20px;border-top:1px solid var(--line)}
.pn a{text-decoration:none;font-size:14px;color:var(--muted);min-height:44px;display:flex;align-items:center}
.pn a:hover{color:var(--ink)}

/* exhibition, about */
.ex-hero img{width:100%;height:min(56vh,520px);object-fit:cover}
.ex-head{display:grid;gap:10px;padding-block:28px 6px}
.ex-head h1{font-family:var(--serif);font-size:52px;line-height:.95}
.ex-head .m{color:var(--muted)}
.prose{max-width:66ch;display:grid;gap:14px;font-size:17px;line-height:1.65}
.views{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.views button{border:0;padding:0;background:none;cursor:zoom-in}
.views img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.about{display:grid;gap:32px;padding-block:28px}
.about img{width:100%;border-radius:4px}
.cv{display:grid;gap:22px}
.cv h3{font-size:14px;font-weight:600;margin-bottom:6px}
.cv dl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 14px;margin:0;font-size:15px}
.cv dt{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.cv dd{margin:0}
.cv dd span{color:var(--muted)}
.contact{display:grid;gap:8px;font-size:15px}
.contact .addr{font-family:var(--mono);user-select:all}

/* home */
.home-h{display:flex;justify-content:space-between;align-items:center;padding-block:20px 6px}
.home-h h1{font-family:var(--serif);font-size:44px;line-height:1}
.feature{display:block;position:relative;border-radius:18px;overflow:hidden;text-decoration:none;background:var(--card)}
.feature img{width:100%;aspect-ratio:4/5;object-fit:cover}
.feature .ov{position:absolute;inset:auto 0 0 0;padding:18px;background:linear-gradient(to top,var(--shade) 30%,transparent);color:#fff;display:grid;gap:6px}
.feature .k{color:#DADAD6}
.feature h2{font-family:var(--serif);font-size:48px;line-height:.95}
.feature .m{font-size:14px;color:#E6E6E2}
.shelf{display:grid;gap:14px;padding-block:28px 0}
.shelf h2{font-family:var(--serif);font-size:30px;line-height:1}
.people{display:flex;gap:18px;overflow-x:auto;padding-bottom:4px}
.person{display:grid;justify-items:center;gap:8px;text-decoration:none;flex:none;width:96px;text-align:center;font-size:13px;line-height:1.3}
.person img,.person .ring{width:96px;height:96px;border-radius:50%;object-fit:cover}
.person .ring{display:grid;place-items:center;border:1.5px dashed var(--muted);color:var(--muted);font-size:30px}
.person .m{color:var(--muted);font-size:12px}
.covers{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:14px;overflow-x:auto;padding-bottom:4px}
.covers a{text-decoration:none;display:grid;gap:8px;min-width:0;font-size:13px;line-height:1.3}
.covers img{width:150px;height:150px;object-fit:cover;border-radius:6px}
.covers .m{color:var(--muted)}
.covers.works .im{width:150px;height:150px;background:var(--stage);border-radius:6px;padding:12px}
.covers.works .im img{width:100%;height:100%;object-fit:contain;border-radius:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.16))}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.place{display:grid;gap:4px;padding:16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-decoration:none}
.place b{font-family:var(--serif);font-size:26px;font-weight:400;line-height:1}
.place .m{font-size:13px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--wall) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{display:grid;justify-items:center;gap:3px;padding:10px 4px 8px;min-height:52px;text-decoration:none;font-size:11px;color:var(--muted)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs svg{width:22px;height:22px}
body.has-tabs main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}

/* album (exhibition) */
.album{display:grid;gap:14px;padding-block:24px 8px}
.album .cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.album h1{font-family:var(--serif);font-size:52px;line-height:.95}
.album .by{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px}
.album .by img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.album .m{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--card);border-radius:10px;padding:10px 12px}
.tracks{display:grid}
.track{display:grid;grid-template-columns:28px 52px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:9px;text-decoration:none;border-bottom:1px solid var(--line)}
.track .n{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.track img{width:52px;height:52px;object-fit:cover;border-radius:4px}
.track .t{min-width:0}
.track .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .m{font-size:13px;color:var(--muted)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--card);border-radius:99px;padding:3px}
.seg button{border:0;background:none;border-radius:99px;padding:8px 14px;min-height:36px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* search */
.search{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.results{display:grid;gap:22px;padding-block:20px}

/* 3D space */
.sv{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);z-index:30;background:#d9d8d4;color:#141516;overflow:hidden;touch-action:none}
.sv canvas{display:block;width:100%;height:100%}
.sv-top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:center}
.sv-x{border:0;background:#FBFBF9;border-radius:99px;min-height:40px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer}
.sv-t{background:#FBFBF9;border-radius:99px;padding:6px 14px;display:grid;line-height:1.2;min-width:0}
.sv-t b{font-size:14px}
.sv-t span{font-size:11px;color:#5d6165;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-modes{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:10px;background:#FBFBF9}
.sv-modes button[aria-pressed="true"]{background:#141516;color:#FBFBF9}
.sv-photo{position:absolute;right:10px;top:calc(60px + env(safe-area-inset-top,0px));width:42%;margin:0;background:#FBFBF9;padding:4px;border-radius:6px;cursor:zoom-in;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.sv-photo.big{width:calc(100% - 20px);cursor:zoom-out}
.sv-photo img{width:100%;border-radius:3px}
.sv-photo figcaption{font-family:var(--mono);font-size:9px;color:#5d6165;padding:4px 2px 0}
.sv-card{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#FBFBF9;border-radius:14px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sv-info{display:grid;gap:2px;font-size:13px;line-height:1.35}
.sv-info b{font-size:16px}
.sv-s{font-family:var(--mono);font-size:12px;color:#5d6165}
.sv-open{justify-self:start;margin-top:6px;border:1.5px solid #141516;background:none;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.sv-nav{display:flex;align-items:center;justify-content:space-between}
.sv-nav button{border:0;background:#141516;color:#FBFBF9;border-radius:99px;min-width:56px;min-height:40px;font-size:16px;cursor:pointer}
.sv-count{font-family:var(--mono);font-size:12px;color:#5d6165}
.sv-joy{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:rgba(251,251,249,.55);border:1.5px solid rgba(20,21,22,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none;display:none}
.sv-joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#141516;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sv.walk .sv-joy{display:block}
.sv.walk .sv-card{left:142px;padding:10px 12px}
.sv.walk .sv-nav{display:none}
.sv.walk .sv-info b{font-size:14px}
.sv.walk .sv-card:has(.sv-info:empty){display:none}
.sv-hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(20,21,22,.78);color:#FBFBF9;border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.5;text-align:center;pointer-events:none;transition:opacity .6s;width:max-content;max-width:80%}
.sv-hint.gone{opacity:0}
.sv-dot{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(20,21,22,.45);box-shadow:0 0 0 1.5px rgba(251,251,249,.7);pointer-events:none;display:none}
.sv.walk .sv-dot{display:block}
.sv-loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:#5d6165;background:#d9d8d4}

/* zoom viewer */
.zoom{position:fixed;inset:0;z-index:20;background:rgba(10,10,11,.94);display:grid;place-items:center;overflow:auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.zoom img{max-width:100vw;max-height:100vh;object-fit:contain;cursor:zoom-in}
.zoom.full{place-items:start}
.zoom.full img{max-width:none;max-height:none;cursor:zoom-out}
.zoom .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:#FBFBF9;color:#141516;border:0;border-radius:99px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<!-- app:head-end -->
</head>
<body>
<!-- app:body -->
<header class="bar gut"><div class="wrap"><a class="brand" href="#/">Studio</a><span class="tag">Prototype</span></div></header>
<main id="app"><div class="loading">Loading…</div></main>
<nav class="tabs" aria-label="Main" hidden>
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Home</a>
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
  <a href="#/places" data-tab="places"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Places</a>
</nav>
<!-- app:body-end -->
<script type="module" src="app.js"></script>
</body>
</html>
