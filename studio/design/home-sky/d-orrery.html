<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The orrery · Open Studio Home</title>
<meta name="theme-color" content="#EEF0FA">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&family=Figtree:wght@700&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Hebrew:wght@600&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* D · The orrery: you are the sun. What you used last goes round you close and quick; your artists further out;
   the outer orbits carry what you haven't met yet. Drawn like an astronomer's notebook: pencil orbits on a dotted
   page, planets in pastels, every name written by hand. Drag spins it; pinch takes you out to the far orbits. */
:root{--h1-size:32px;--ground:#F1F2FA;--ink:#2B2F63;--muted:#5D608E;--line:#DCDDF0;--card:#FFFFFF;--chip:rgba(255,255,255,.84);--shade:rgba(43,47,99,.36);--sel:#F7D58A;
  --display:'Fraunces',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--hand:'Kalam',cursive;--hand-ink:#3C44A6;--hand-size:18px;--hand-weight:400;
  --tie:#7F84C2;--live:#E2557A;--accent-ink:#B23E65;--me-bg:#F7D58A;--me-ink:#2B2F63;
  --pink:#F6B9C9;--blue:#AFD3F0;--mint:#B9E4CF;--sun:#F7D58A;--lilac:#CDC2F4;--peach:#F8C9AE;--halo:rgba(241,242,250,.95);
  --page:radial-gradient(circle at 1px 1px,rgba(43,47,99,.13) 1px,transparent 1.3px) 0 0/18px 18px,linear-gradient(180deg,#EEF0FB,#F4EEF6)}
.hero{background:var(--page)}
.skybox.full{background:var(--page)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:60px;background:linear-gradient(to bottom,transparent,var(--ground));pointer-events:none;z-index:11}
.sky-ui,.pick{z-index:16}
.orbit{fill:none;stroke:#8E92C8;stroke-width:1}
.orbit.o2{stroke-dasharray:3 5}
.olab{font:400 15px var(--hand);fill:#5D63B4}
.star .st{width:var(--d);height:var(--d);transform:translate(-50%,-50%);border-radius:50%;display:block;background:var(--c) center/cover no-repeat;box-shadow:inset -6px -8px 14px rgba(43,47,99,.28),inset 5px 6px 10px rgba(255,255,255,.55),0 8px 18px -10px var(--shade)}
.star:not(.has-img) .st{background:radial-gradient(circle at 34% 30%,#fff 0 6%,var(--c) 40%,color-mix(in srgb,var(--c) 70%,#2B2F63) 100%)}
.star.r0 .st{--d:54px}.star.r1 .st{--d:40px}.star.r2 .st{--d:22px}
.star.real .st{--d:14px}
.star.k-show .st::after{content:"";position:absolute;left:50%;top:50%;width:170%;height:46%;border:1.5px solid color-mix(in srgb,var(--c) 70%,#2B2F63);border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg);pointer-events:none}
.star.k-show .st{position:relative}
.k-artist{--c:var(--pink)}.k-show{--c:var(--blue)}.k-tour{--c:var(--lilac)}.k-place{--c:var(--peach)}.k-work{--c:var(--mint)}
.star .lab{width:140px;transform:translate(-50%,calc(var(--d,30px)/2 + 6px));text-align:center;display:grid;pointer-events:none}
.star .lab b{font:400 17px/1.05 var(--hand);color:var(--ink)}
.star .lab small{display:none;font-size:11.5px;color:var(--muted)}
.star.on .lab small{display:block}
.star .lab .hand{font-size:15px;color:#6A70B8}
.star:not(.on) .lab .hand{display:none}
.star.real .lab{--d:14px}
.star.k-you .sun{width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;font:400 22px var(--hand);color:var(--ink);
  background:radial-gradient(circle at 38% 34%,#FFF6D8,var(--sun) 58%,#EDB95E);box-shadow:0 0 0 10px color-mix(in srgb,var(--sun) 35%,transparent),0 0 0 22px color-mix(in srgb,var(--sun) 16%,transparent)}
.pick .dot{background:var(--c)}
.lg-artist{background:var(--pink)}.lg-show{background:var(--blue)}.lg-tour{background:var(--lilac)}.lg-place{background:var(--peach)}
.sec-h h2{font-family:var(--display)}
.tour[data-shape=rect]{border-radius:30px}
.ppl img{box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 0 0 4px var(--pink)}
.ppl li:nth-child(2) img{box-shadow:0 0 0 4px var(--blue)}.ppl li:nth-child(3) img{box-shadow:0 0 0 4px var(--sun)}
.ppl b{font-family:var(--display)}
.shows img{border-radius:50%;aspect-ratio:1;width:86%;margin:0 auto}
.shows li{flex-basis:62%}
.map{border-radius:30px}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { home } from './home.js';

const NS = 'http://www.w3.org/2000/svg';
// orbits: [radius across, radius deep, speed (rad/s), label] — oval, so they fill a tall phone
const ORB = [[128, 168, .04, 'where you were'], [196, 268, .025, 'yours'], [290, 395, .015, 'not met yet'], [375, 510, .010, '']];
const start = {};
const layout = (st) => {
  const by = [0, 1, 2, 3].map(i => st.filter(s => i < 2 ? s.ring === i : s.ring === 2 && (i === 2) === (st.filter(x => x.ring === 2).indexOf(s) % 2 === 0)));
  by.forEach((list, i) => list.forEach((s, j) => { s.orb = i; start[s.id] = j / list.length * Math.PI * 2 + i * .7; }));
  place(0, st);
};
const place = (t, st) => st.forEach(s => {
  if (s.kind === 'you') { s.x = s.y = s.z = 0; return; }
  const [a, b, w] = ORB[s.orb], th = start[s.id] + t * w;
  s.x = Math.cos(th) * a; s.z = Math.sin(th) * b; s.y = 0;
});

const node = s => s.kind === 'you' ? `<span class="sun">you</span>`
  : `<span class="st"${s.img ? ` style="background-image:url(${s.img})"` : ''}></span><span class="lab"><b${/[֐-׿]/.test(s.name) ? ' dir="rtl"' : ''}>${s.name}</b>${s.sub ? `<small>${s.sub}</small>` : ''}${s.note ? `<span class="hand">${s.note}</span>` : ''}</span>`;

let rings = null;
home({
  tourShape: 'rect',
  copy: { title: 'Around you, today', hand: 'the closer the orbit, the more recently you were there', hint: 'Drag to spin · pinch to reach the far orbits', live: 'Walk in now', end: 'one more turn tomorrow' },
  legend: [['artist', 'Artists'], ['show', 'Shows'], ['tour', 'In 3D'], ['place', 'Places']],
  sky: {
    cam: { D: 860, pitch: 0.9 }, F: 640, cy: 0.57, limits: { yaw: Infinity, pitchMin: .35, pitchMax: 1.3, Dmin: 380, Dmax: 1700 }, keepPitch: true, pitchAlways: false,
    farFrom: 860, fogStart: 300, fogRange: 2200, minOp: .35, labelAt: .62, bigAt: .8, maxScale: 1.3, drift: 0, ties: [],
    layout, tick: place, node,
    extra(g, project, cam) {
      if (!rings) { rings = ORB.map((o, i) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('class', `orbit o${i}`); const tx = document.createElementNS(NS, 'text'); tx.setAttribute('class', 'olab'); tx.textContent = o[3]; g.append(p, tx); return [p, tx]; }); }
      ORB.forEach(([a, b, , lab], i) => {
        let d = ''; for (let k = 0; k <= 96; k++) { const th = k / 96 * Math.PI * 2, wob = 1 + Math.sin(th * 7 + i) * .006; const q = project({ x: Math.cos(th) * a * wob, y: 0, z: Math.sin(th) * b * wob }); d += `${k ? 'L' : 'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`; }
        const [p, tx] = rings[i]; p.setAttribute('d', d);
        p.style.opacity = i < 2 ? '.9' : Math.max(.25, Math.min(.9, (cam.D - 600) / 500)).toFixed(2);
        const q = project({ x: Math.cos(-2.2) * a, y: 0, z: Math.sin(-2.2) * b }); tx.setAttribute('x', (q.x + 6).toFixed(1)); tx.setAttribute('y', (q.y - 6).toFixed(1));
        tx.style.opacity = i === 3 ? 0 : p.style.opacity;
      });
    },
  },
});
</script>
</body>
</html>
