  bronze: std(0x6a543a, { roughness: 0.45, metalness: 0.5 }), stone: std(0xe6e1d6, { roughness: 0.6 }), leaf: std(0x7d9a68), trunk: std(0x6b5a48),

const mat = m => typeof m === 'string' ? M[m] : m;

// ---- primitives ---------------------------------------------------------------------------------------------------------

// a wall from a to b; o.gaps: [[from, to, doorHeight]] along it (a lintel closes the wall above a door lower than the wall)
