<!doctype html>
<!-- Design studies for the art map: the same places and buildings, drawn in different ways (?v=...).
     Rendered by shots.js for the map-ideas PDF; not part of the app. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../app/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html,body{margin:0;height:100%;font-family:'IBM Plex Sans',sans-serif}
#map{position:absolute;inset:0}
.ov{position:absolute;z-index:3;pointer-events:none}
.cap{left:16px;right:16px;bottom:16px;font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase}
.cards{left:0;right:0;bottom:22px;display:flex;gap:10px;padding:0 16px;overflow:hidden}
.card{flex:none;width:250px;background:#FFFDF8;border-radius:20px;padding:14px;box-shadow:0 12px 30px -14px rgba(0,0,0,.45);display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center}
.card b{display:block;font-size:15px}.card span{font-size:12px;color:#6E665C}.card i{display:block;width:54px;height:54px;border-radius:14px}
.title{left:20px;top:64px;font-family:Fraunces,serif;font-size:40px;line-height:1}
.title small{display:block;font:500 11px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;opacity:.7}
.maplibregl-ctrl-attrib{display:none!important}
</style></head><body><div id="map"></div>
<script src="../../app/vendor/maplibre/maplibre-gl.js"></script>
<script>
const Q = new URLSearchParams(location.search), V = Q.get('v') || 'atlas';
const KINDS = { museum: '#2F4FD0', public: '#E2553B', commercial: '#E9A23B', 'artist-run': '#1C9C86', academy: '#7B52D6', centre: '#D8578F' };
const NIGHT = { museum: '#6E8BFF', public: '#FF7A5C', commercial: '#FFC15E', 'artist-run': '#3FE0C0', academy: '#B48CFF', centre: '#FF7FB6' };
const P = {
  atlas: { bg: '#F3EEE5', water: '#BFDCDD', park: '#DCE5C9', road: '#FFFDF8', roadCase: '#E4DACB', city: '#EFE9DF', cityK: 0.4, cityO: 0.62, label: '#7B7266', halo: '#F3EEE5', cols: KINDS },
  night: { bg: '#14161C', water: '#0E1F2A', park: '#18221C', road: '#2A2E38', roadCase: '#1A1D24', city: '#23262E', cityK: 0.45, cityO: 0.9, label: '#8C93A3', halo: '#14161C', cols: NIGHT },
  wash: { bg: '#F6F1E7', water: '#CFE3E1', park: '#E4EAD3', road: '#FFFFFF', roadCase: '#EDE5D8', city: '#EDE6DA', cityK: 0, cityO: 0, label: '#8A8175', halo: '#F6F1E7', cols: KINDS },
  model: { bg: '#E9E6E1', water: '#D3DDE0', park: '#E1E4DA', road: '#F7F5F2', roadCase: '#DCD8D2', city: '#FBFAF8', cityK: 1, cityO: 1, label: '#5E5A55', halo: '#E9E6E1', cols: KINDS },
};
const T = P[V] || P[{ cards: 'atlas', floors: 'atlas', ghost: 'atlas', activity: 'atlas', lantern: 'night', pulse: 'atlas', artwork: 'atlas' }[V]] || P.atlas;
const NAME = ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']];
const style = {
  version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources: { omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' } },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': T.bg } },
    { id: 'park', type: 'fill', source: 'omt', 'source-layer': 'park', paint: { 'fill-color': T.park } },
    { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': T.water } },
    { id: 'rc', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['in', ['get', 'class'], ['literal', ['primary', 'secondary', 'tertiary', 'trunk', 'motorway']]], paint: { 'line-color': T.roadCase, 'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 10, 1.4, 14, 5, 18, 26] } },
    { id: 'r', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['in', ['get', 'class'], ['literal', ['primary', 'secondary', 'tertiary', 'trunk', 'motorway', 'minor', 'service']]], paint: { 'line-color': T.road, 'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 10, 0.6, 14, 2.6, 18, 18] } },
    { id: 'city', type: 'fill-extrusion', source: 'omt', 'source-layer': 'building', minzoom: 13,
      paint: { 'fill-extrusion-color': T.city, 'fill-extrusion-height': ['*', ['coalesce', ['get', 'render_height'], 6], T.cityK], 'fill-extrusion-opacity': T.cityO } },
    { id: 'lbl', type: 'symbol', source: 'omt', 'source-layer': 'place', filter: ['in', ['get', 'class'], ['literal', ['city', 'suburb', 'neighbourhood', 'quarter']]],
      layout: { 'text-field': NAME, 'text-font': ['Noto Sans Regular'], 'text-transform': 'uppercase', 'text-letter-spacing': 0.14, 'text-size': 11 },
      paint: { 'text-color': T.label, 'text-halo-color': T.halo, 'text-halo-width': 1.4 } },
  ],
};
if (V === 'model') style.light = { anchor: 'map', position: [1.4, 200, 35], intensity: 0.55, color: '#fff' };
if (V === 'night' || V === 'lantern') style.light = { anchor: 'map', position: [1.2, 160, 60], intensity: 0.25 };

const ring = (p, k = 1.03) => { const r = p.building ? p.building.ring : oct(p.at); const cx = r.reduce((s, q) => s + q[0], 0) / r.length, cy = r.reduce((s, q) => s + q[1], 0) / r.length; return r.map(([x, y]) => [cx + (x - cx) * k, cy + (y - cy) * k]); };
function oct([lat, lon], r = 9) { const o = []; for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + Math.PI / 8; o.push([lon + r * Math.cos(a) / (111320 * Math.cos(lat * Math.PI / 180)), lat + r * Math.sin(a) / 110540]); } return o; }

(async () => {
  const places = (await (await fetch('../../app/data/art/places.json')).json()).places;
  const ex = await fetch('../../app/data/art/exhibitions.json').then(r => r.ok ? r.json() : { shows: [] }).catch(() => ({ shows: [] }));
  const on = new Map(); ex.shows.forEach(s => on.set(s.place, (on.get(s.place) || 0) + 1));
  const at = (Q.get('at') || '32.0525,34.7722').split(',').map(Number);
  const map = new maplibregl.Map({ container: 'map', style, center: [at[1], at[0]], zoom: +(Q.get('z') || 15.4), pitch: +(Q.get('p') || 58), bearing: +(Q.get('b') || -24), interactive: false, attributionControl: false, preserveDrawingBuffer: true });
  map.on('load', async () => {
    // groups by building, for floors
    const groups = new Map();
    places.forEach(p => { const k = p.building ? p.building.osm : p.id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
    const feats = [];
    for (const g of groups.values()) {
      const b = g[0].building, total = Math.max((b && b.h || 0) * 0.8, g.length * 7, 16);
      g.forEach((p, i) => {
        const n = on.get(p.id) || 0, closed = /Herzliya Museum/.test(p.name);
        let base = 0, h = Math.max((b && b.h || 0) * 0.8, p.kind === 'museum' ? 24 : 16);
        if (V !== 'atlas' || true) { base = total * i / g.length; h = total * (i + 1) / g.length - (i < g.length - 1 ? 0.6 : 0); }
        if (V === 'activity') { base = 0; h = 8 + n * 9; }
        feats.push({ type: 'Feature', properties: { c: T.cols[p.kind], base, h, closed, n, id: p.id }, geometry: { type: 'Polygon', coordinates: [[...ring(p), ring(p)[0]]] } });
      });
    }
    const pts = places.map(p => ({ type: 'Feature', properties: { c: T.cols[p.kind], n: on.get(p.id) || 0, label: p.name }, geometry: { type: 'Point', coordinates: [p.at[1], p.at[0]] } }));
    map.addSource('a', { type: 'geojson', data: { type: 'FeatureCollection', features: feats } });
    map.addSource('pt', { type: 'geojson', data: { type: 'FeatureCollection', features: pts } });
    const wash = V === 'wash';
    map.addLayer({ id: 'wash', type: 'circle', source: 'pt', paint: { 'circle-color': ['get', 'c'], 'circle-blur': 1, 'circle-pitch-alignment': 'map',
      'circle-radius': ['interpolate', ['exponential', 1.7], ['zoom'], 12, wash ? 60 : 34, 15, wash ? 260 : 150, 18, 700],
      'circle-opacity': wash ? 0.42 : V === 'night' || V === 'lantern' ? 0.35 : 0.22 } }, 'lbl');
    if (!wash) map.addLayer({ id: 'art', type: 'fill-extrusion', source: 'a', paint: {
      'fill-extrusion-color': V === 'ghost' ? ['case', ['get', 'closed'], '#B9B2A6', ['get', 'c']] : ['get', 'c'],
      'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-base': ['get', 'base'],
      'fill-extrusion-opacity': V === 'ghost' ? 0.55 : 0.97, 'fill-extrusion-vertical-gradient': true } });
    if (V === 'pulse' || V === 'night' || V === 'lantern') [70, 130, 200].forEach((r, i) => map.addLayer({ id: 'ring' + i, type: 'circle', source: 'pt', filter: ['>', ['get', 'n'], 0],
      paint: { 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': ['get', 'c'], 'circle-stroke-width': 2.2 - i * 0.6, 'circle-stroke-opacity': 0.9 - i * 0.3, 'circle-pitch-alignment': 'map', 'circle-radius': r * Math.pow(2, map.getZoom() - 16) } }));
    if (V === 'artwork' && Q.get('img')) {
      const im = await map.loadImage(Q.get('img'));
      map.addImage('art-img', im.data);
      map.addLayer({ id: 'art-pattern', type: 'fill-extrusion', source: 'a', filter: ['==', ['get', 'id'], Q.get('id')], paint: {
        'fill-extrusion-pattern': 'art-img', 'fill-extrusion-height': ['+', ['get', 'h'], 0.3], 'fill-extrusion-base': ['get', 'base'] } });
    }
    if (wash || V === 'cards' || V === 'atlas' || V === 'model' || V === 'night') map.addLayer({ id: 'name', type: 'symbol', source: 'pt', minzoom: 14.3,
      layout: { 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Bold'], 'text-size': 11.5, 'text-anchor': 'top', 'text-offset': [0, 0.9], 'text-max-width': 9, 'text-optional': true },
      paint: { 'text-color': V === 'night' ? '#F3F0EA' : '#1B1A17', 'text-halo-color': V === 'night' ? 'rgba(20,22,28,.9)' : 'rgba(255,253,248,.95)', 'text-halo-width': 1.6 } });
    map.once('idle', () => { document.body.dataset.ready = '1'; });
  });
  const ov = Q.get('ov');
  if (ov === 'cards') {
    document.body.insertAdjacentHTML('beforeend', `<div class="ov cards">${places.filter(p => on.get(p.id)).slice(0, 3).map(p => `<div class="card"><i style="background:${KINDS[p.kind]}"></i><div><b>${p.name}</b><span>${on.get(p.id)} shows on</span></div></div>`).join('')}</div>`);
  }
  if (Q.get('t')) document.body.insertAdjacentHTML('beforeend', `<div class="ov title" style="color:${V === 'night' ? '#F3F0EA' : '#1B1A17'}"><small>${Q.get('k') || 'The art map'}</small>${Q.get('t')}</div>`);
})();
</script></body></html>
