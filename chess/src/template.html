<div class="app" dir="rtl">
  <header class="top">
    <div class="brand">
      <div class="logo">♞</div>
      <div>
        <h1>מאמן השחמט · 900 → 1400</h1>
        <p>תרגול חי: פתיחות, רעיונות, סיומים ומעקב</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="progress-chip">
      <div class="xp" id="xp">0</div>
      <div id="hstat"><b>0 XP</b><small>🔥 0 · דיוק 0%</small></div>
    </div>
    <button class="icon-btn" id="themeBtn" title="מצב תצוגה" aria-label="החלף מצב תצוגה">☾</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div class="main" id="main">
    <div class="board-col" id="boardarea">
      <div class="ctxbar" id="ctxbar"></div>
      <div class="board-wrap">
        <div class="board-frame" dir="ltr">
          <div class="board" id="board"></div>
        </div>
        <div class="controls">
          <button class="ctrl" id="c-undo">↶ אחורה</button>
          <button class="ctrl" id="c-hint">💡 רמז</button>
          <button class="ctrl" id="c-flip">⇅ הפוך לוח</button>
          <button class="ctrl" id="c-reset">↺ אתחל</button>
          <button class="ctrl primary hidden" id="c-next">הבא ›</button>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h2>רשימת מהלכים</h2>
        <div class="movelist" id="movelist"></div>
      </div>
    </div>

    <div class="panel" id="panel"></div>
  </div>

  <div class="footer-note">נבנה מתוך המצגת <b>“מ־900 ל־1400”</b> · כל הנקודות: פתיחות, מבנים, מוטיבים, סיומים, חשיבה, קורס ומעקב</div>
</div>
